---
- name: Create multiple Docker containers from a name list
  hosts: localhost
  become: true
  vars:
    config_base_path: "/opt/most-giroe"
    image_name: "most-giroe-victron"
    image_tag: "latest-test"
    base_container_name: "most-giroe"
    installations: "{{ lookup('file', 'installations.yml') | from_yaml }}"
  
  tasks:
    - name: Set current timestamp variable
      set_fact:
        release_tag: "{{ lookup('pipe', 'date +%Y%m%dT%H%M') }}"
    - debug:
        msg: "Current Release is {{ release_tag }}"

    - name: Build Docker image
      community.docker.docker_image:
        name: "{{ image_name }}"
        tag: "{{ release_tag }}"
        source: build
        build:
          path: "./"

    - name: Ensure base directory `{{ config_base_path }}` exists 
      ansible.builtin.file:
        path: "{{ config_base_path }}"
        state: directory
        mode: '0755'
        owner: giroe
        group: docker

    - name: Ensure config directory exists in `{{ config_base_path }}`
      ansible.builtin.file:
        path: "{{ config_base_path }}/config"
        state: directory
        mode: '0755'
        owner: giroe
        group: docker
    
    
    - name : Remove ofelia container
      community.docker.docker_container:
        name: "most-ofelia"
        state: absent
        force_kill: true

    - name : Remove autoheal container
      community.docker.docker_container:
        name: "most-autoheal"
        state: absent
        force_kill: true
    
    - name: Remove existing containers
      community.docker.docker_container:
        name: "{{ base_container_name }}-{{ installation.name }}"
        state: absent
        force_kill: true
      loop: "{{ installations }}"
      loop_control:
        loop_var: installation

    - name: Generate INI config file
      ansible.builtin.template:
        src: config/config.ini.j2
        dest: "{{ config_base_path }}/config/{{ installation.name }}-config.ini"
        mode: '0644'
      loop: "{{ installations }}"
      loop_control:
        loop_var: installation
    
    - name: Generate ofelia configuration
      template:
        src: "ofelia.ini.j2"
        dest: "{{ config_base_path }}/ofelia.ini"

    - name: Create containers from list
      community.docker.docker_container:
        name: "{{ base_container_name }}-{{ installation.name }}"
        image: "{{ image_name }}:{{ release_tag }}"
        volumes:
          - "{{ config_base_path }}/config/{{ installation.name }}-config.ini:/config/config.ini:ro"
        state: started
        restart_policy: always
        labels:
          autoheal-monitoring: "true"
        auto_remove: false 
      loop: "{{ installations }}"
      loop_control:
        loop_var: installation

    - name: Create monitoring container
      community.docker.docker_container:
        name: "most-autoheal"
        image: "willfarrell/autoheal:1.1.0"
        volumes:
          - "/var/run/docker.sock:/var/run/docker.sock"
          - "/etc/localtime:/etc/localtime:ro"
        env:
          AUTOHEAL_CONTAINER_LABEL: "autoheal-monitoring"
          AUTOHEAL_INTERVAL : "960"
          AUTOHEAL_START_PERIOD : "300"
          AUTOHEAL_DEFAULT_STOP_TIMEOUT : "30"	
        state: started
        restart_policy: always
        auto_remove: false 
    
    - name: Create restarting container
      community.docker.docker_container:
        name: "most-ofelia"
        image: "mcuadros/ofelia:latest"
        volumes:
          - "/var/run/docker.sock:/var/run/docker.sock"
          - "/etc/localtime:/etc/localtime:ro"
          - "{{ config_base_path }}/ofelia.ini:/etc/ofelia/config.ini"
        state: started
        restart_policy: always
        auto_remove: false 